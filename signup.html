
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#010207">

    <title>Create Account | AtomiX Corp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="images/AtomiX_Corp_Logo.png" alt="AtomiX Corp Logo">
            <span>AtomiX Corp</span>
        </a>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="about_us.html">About</a>
            <a href="assets.html">Assets</a>
        </nav>
    </header>


    <!-- SIGNUP SECTION -->
    <main>

        <section class="auth-section">

            <div class="auth-container">

                <div class="auth-heading">
                    <p class="eyebrow">JOIN THE ECOSYSTEM</p>

                    <h1>Create your <span>AtomiX account.</span></h1>

                    <p>
                        Become part of the AtomiX community and stay
                        connected with our projects and experiences.
                    </p>
                </div>


                <!-- SIGNUP FORM -->
                <form id="signup-form" class="auth-form">

                    <div class="auth-field">
                        <label for="signup-email">Email address</label>

                        <input
                            type="email"
                            id="signup-email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>


                    <div class="auth-field">
                        <label for="signup-password">Password</label>

                        <input
                            type="password"
                            id="signup-password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>


                    <div class="auth-field">
                        <label for="signup-confirm-password">Confirm password</label>

                        <input
                            type="password"
                            id="signup-confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>


                    <button type="submit" class="auth-submit">
                        Create Account
                    </button>

                    <p id="signup-message" class="auth-message" role="status" aria-live="polite"></p>

                </form>


                <div class="auth-switch">
                    Already have an account?
                    <a href="signin.html">Sign in</a>
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <div class="footer-bottom">
            <p>&copy; <span id="year"></span> AtomiX Corp.</p>
            <span class="footer-bottom-label">CREATING WHAT'S NEXT</span>
        </div>

    </footer>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ATOMIX SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
